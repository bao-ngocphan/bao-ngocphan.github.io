<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bao-Ngoc Phan</title>
<script>
  // GitHub Pages serves this file for any path that has no real file (e.g. /projects).
  // Remember the requested URL, then send the visitor to the homepage,
  // where index.html restores the URL and shows the right page.
  try{ sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash); }catch(e){}
  location.replace('/');
</script>
</head>
<body></body>
</html>
